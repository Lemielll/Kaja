name: Service contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heavy_rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heavy_rental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: service/package-lock.json
      - name: Install service dependencies
        run: npm ci
        working-directory: service
      - name: Apply schema and seed data
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d heavy_rental -f service/db/schema.sql
          psql -h 127.0.0.1 -U postgres -d heavy_rental -f service/db/seed.sql
      - name: Start service and run conformance checks
        env:
          PORT: 3000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/heavy_rental
          NODE_ENV: test
          BASE_URL: http://127.0.0.1:3000/v1
          OIDC_ISSUER: https://test.local/
          OIDC_JWKS_URI: http://127.0.0.1:9999/jwks.json
          OIDC_AUDIENCE: kaja-api
        run: |
          set -o pipefail

          npm start > service.log 2>&1 &
          service_pid=$!

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              break
            fi

            if ! kill -0 "$service_pid" 2>/dev/null; then
              echo "Service exited during startup:"
              cat service.log
              exit 1
            fi

            sleep 1
          done

          if ! curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
            echo "Service failed health check:"
            cat service.log
            exit 1
          fi

          npm run test:contract
          npm run verify:idempotency
          npm run verify:inspections
        working-directory: service

