services:
  # One-shot realm seeding. Keycloak 26 removed `--import-realm` from `start`, so the
  # realm is loaded by a separate job that must succeed before `kaja-auth` starts.
  # Both share the same dev-file (H2) disk, so the imported realm is visible to it.
  # realm-export.json lives in /opt/keycloak/import (image layer), so mounting a disk
  # at /opt/keycloak/data does not shadow the import file.
  - type: job
    name: kaja-auth-seed
    runtime: image
    image:
      url: quay.io/keycloak/keycloak:26.0
    dockerfilePath: infra/Dockerfile.keycloak
    dockerContext: infra
    disk:
      name: keycloak-seed-data
      mountPath: /opt/keycloak/data
      sizeGB: 1
    envVars:
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_DB
        value: dev-file
    # `import` is a standalone command in Keycloak 26 and needs an explicit file.
    startCommand: import --optimized --file /opt/keycloak/import/realm-export.json
    autoDeployTrigger: commit

  - type: web
    name: kaja-auth
    runtime: image
    image:
      url: quay.io/keycloak/keycloak:26.0
    dockerfilePath: infra/Dockerfile.keycloak
    dockerContext: infra
    disk:
      name: keycloak-seed-data
      mountPath: /opt/keycloak/data
      sizeGB: 1
    envVars:
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: KC_HTTP_PORT
        value: "8080"
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_HEALTH_ENABLED
        value: "true"
      - key: KC_DB
        value: dev-file
    # The Keycloak image ships no curl, and /health/ready lives on the management
    # port (9000) which Render does not expose. Probing the realm also makes the
    # health check fail if the seed job never ran, instead of reporting healthy
    # with an empty realm.
    healthCheckPath: /realms/kaja
    startCommand: start --optimized
    autoDeploy: false

  - type: web
    name: kaja-api
    runtime: node
    rootDir: service
    buildCommand: npm install
    startCommand: node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4010"
      - key: DATABASE_URL
        fromDatabase:
          name: kaja-db
          property: connectionString
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_JWKS_URI
        sync: false
      - key: OIDC_AUDIENCE
        value: kaja-api
      - key: CORS_ALLOWED_ORIGINS
        sync: false
    autoDeploy: false

  - type: web
    name: kaja-web
    runtime: static
    rootDir: clients/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        value: https://kaja-service-0cns.onrender.com/v1
      - key: VITE_OIDC_ISSUER
        value: https://kaja-auth.onrender.com/realms/kaja
      - key: VITE_OIDC_CLIENT_ID
        value: web-app
    autoDeploy: false

databases:
  - name: kaja-db
    plan: free
    databaseName: kaja
